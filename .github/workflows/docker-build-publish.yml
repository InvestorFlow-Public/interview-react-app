name: "2. Build & Publish Container Images"

on:
  push:
    branches:
      - main
    paths:
      - "my-app/**"
      - "Dockerfile*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: "investorflowacr"
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-publish:
    name: "Build, Scan & Push to ACR"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry (ACR)
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Build React Nginx Image
        run: |
          docker build \
            -f Dockerfile.prod \
            -t ${{ env.ACR_NAME }}.azurecr.io/interview-react-app:${{ env.IMAGE_TAG }} \
            -t ${{ env.ACR_NAME }}.azurecr.io/interview-react-app:latest \
            .

      - name: Scan React Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.ACR_NAME }}.azurecr.io/interview-react-app:${{ env.IMAGE_TAG }}"
          severity: "HIGH,CRITICAL"
          exit-code: "0"

      - name: Push Images to ACR
        run: |
          docker push ${{ env.ACR_NAME }}.azurecr.io/interview-react-app:${{ env.IMAGE_TAG }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/interview-react-app:latest
